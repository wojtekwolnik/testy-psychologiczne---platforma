name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testy_psychologiczne_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Prepare environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:password@localhost:5433/testy_psychologiczne_test" > .env
        echo "JWT_SECRET=super_secret_ci_key_for_testing" >> .env
        echo "DATABASE_URL=postgresql://postgres:password@localhost:5433/testy_psychologiczne_test" > .env.test
        echo "JWT_SECRET=super_secret_ci_key_for_testing" >> .env.test

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run ESLint
      run: npm run lint

    - name: Run Tests
      run: npm test -- --run

    - name: Build Next.js application
      run: npm run build
